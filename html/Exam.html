<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Exam page</title>
    <link rel="stylesheet" href="../css/spaceBG.css" />
    <link rel="stylesheet" href="../css/Exam.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
      .exam-content {
        display: none;
      }
      .exam-content.active {
        display: block;
      }

      .ready-btn {
        background: transparent;
        color: #00ff88;
        border: 2px solid #00ff88;
        padding: 12px 30px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        position: relative;
        overflow: hidden;
        margin: 0 15px;
        text-shadow: 0 0 5px #00ff88;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }

      .ready-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 255, 136, 0.2),
          transparent
        );
        transition: 0.5s;
      }

      .ready-btn:hover {
        background: rgba(0, 255, 136, 0.1);
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        transform: scale(1.05);
      }

      .ready-btn:hover::before {
        left: 100%;
      }

      .ready-btn:active {
        transform: scale(0.95);
        box-shadow: 0 0 5px rgba(0, 255, 136, 0.3);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        margin-bottom: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .header h1 {
        margin: 0;
        color: #fff;
        text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        font-size: 28px;
        letter-spacing: 1px;
      }

      #confirmExitModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: rgba(20, 20, 30, 0.95);
        border: 1px solid rgba(0, 255, 136, 0.3);
        border-radius: 10px;
        width: 90%;
        max-width: 500px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        animation: modalFadeIn 0.3s ease;
      }

      @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }

      .modal-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      }

      .modal-icon {
        width: 40px;
        height: 40px;
        background: rgba(0, 255, 136, 0.1);
        border: 2px solid #00ff88;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-icon i {
        color: #00ff88;
        font-size: 20px;
      }

      .modal-title {
        color: #fff;
        margin: 0;
        font-size: 24px;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }

      .modal-body {
        margin-bottom: 25px;
      }

      .modal-message {
        text-align: center;
      }

      .warning-text {
        color: #ff4444;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
      }

      .message-text {
        color: #fff;
        font-size: 16px;
        line-height: 1.5;
      }

      .modal-footer {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .modal-button {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
      }

      .modal-button i {
        font-size: 18px;
      }

      .modal-button.cancel {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .modal-button.confirm {
        background: rgba(255, 68, 68, 0.1);
        color: #ff4444;
        border: 1px solid #ff4444;
      }

      .modal-button:hover {
        transform: translateY(-2px);
      }

      .modal-button.cancel:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .modal-button.confirm:hover {
        background: rgba(255, 68, 68, 0.2);
      }

      .modal-button:active {
        transform: translateY(1px);
      }
      /* Responsive Additions */
@media screen and (max-width: 1200px) {
    .exam-container {
        padding: 15px;
    }

    .header {
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .header h1 {
        text-align: center;
        font-size: 24px;
    }

    .main-section {
        flex-direction: column;
    }

    .left-section, .right-section {
        width: 100%;
    }

    .actions {
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    .actions button {
        flex-grow: 1;
        max-width: 45%;
    }
}

@media screen and (max-width: 768px) {
    .header {
        padding: 15px 10px;
    }

    .header h1 {
        font-size: 20px;
    }

    .ready-btn {
        padding: 10px 20px;
        font-size: 14px;
    }

    .question-numbers {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
    }

    .question-number {
        width: 30px;
        height: 30px;
        font-size: 14px;
    }

    .list-toggle-buttons {
        flex-direction: column;
        gap: 10px;
    }

    .list-toggle-buttons button {
        width: 100%;
    }

    .modal-content {
        width: 95%;
        margin: 0 10px;
    }

    .modal-title {
        font-size: 20px;
    }

    .modal-footer {
        flex-direction: column;
        gap: 10px;
    }

    .modal-button {
        width: 100%;
    }
}

@media screen and (max-width: 480px) {
    .header {
        padding: 10px 5px;
    }

    .header h1 {
        font-size: 18px;
    }

    .ready-btn {
        padding: 8px 15px;
        font-size: 12px;
    }

    .question-number {
        width: 25px;
        height: 25px;
        font-size: 12px;
    }

    .actions button {
        font-size: 12px;
        padding: 8px 15px;
    }

    .modal-header {
        flex-direction: column;
        text-align: center;
        gap: 10px;
    }

    .modal-icon {
        width: 30px;
        height: 30px;
    }

    .modal-title {
        font-size: 18px;
    }

    .message-text {
        font-size: 14px;
    }
}

html, body {
    max-width: 100%;
    overflow-x: hidden;
}

.scene {
    min-height: 100vh;
    width: 100%;
}

.exam-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
}

.main-section {
    display: flex;
    gap: 20px;
}

.left-section, .right-section {
    flex: 1;
}

.actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
}

button, input {
    touch-action: manipulation;
    min-height: 44px;
    min-width: 44px;
}

* {
    max-width: 100%;
    word-wrap: break-word;
}
    </style>
  </head>

  <body>
    <section class="scene">
      <div class="stars"></div>
      <div class="exam-container">
        <div class="header">
          <h1>Space Knowledge Test</h1>
          <button class="ready-btn">Ready to Start Exam</button>
          <div class="timer">
            <!-- <img src="../images/download (1).png" class="clock-icon"> -->
            <!-- <p class="time-display">02:00</p> -->
          </div>
        </div>

        <div class="exam-content">
          <div class="question-numbers">
            <div class="question-number active">1</div>
            <div class="question-number">2</div>
            <div class="question-number">3</div>
            <div class="question-number">4</div>
            <div class="question-number">5</div>
          </div>

          <div class="main-section">
            <div class="left-section">
              <div class="question-container">
                <h3 id="question-title">Question 1</h3>
                <p id="question-text"></p>
                <div id="answers-container"></div>
              </div>
            </div>

            <!-- Right Section -->
            <div class="right-section">
              <div class="list-toggle-buttons">
                <button id="showMarkedBtn">Marked Questions</button>
                <button id="showUnansweredBtn">Unanswered Questions</button>
              </div>
            </div>

            <!-- Popup: Marked Questions -->
            <div id="markedPopup" class="popup">
              <div class="popup-content">
                <span class="close-btn" onclick="closePopup('markedPopup')">&times;</span>
                <h3>Marked Questions</h3>
                <ul id="markedList"></ul>
              </div>
            </div>

            <!-- Popup: Unanswered Questions -->
            <div id="unansweredPopup" class="popup">
              <div class="popup-content">
                <span class="close-btn">&times;</span>
                <h3>Unanswered Questions</h3>
                <ul id="unansweredList"></ul>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="prevBtn" class="nav-btn">Previous</button>
            <button id="markBtn" class="mark-btn">Mark</button>
            <button id="nextBtn" class="nav-btn">Next</button>
            <button id="submitBtn" class="submit-btn">Submit</button>
          </div>
        </div>
      </div>

      <!-- Exit Confirmation Modal -->
      <div id="confirmExitModal">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-icon">
              <i class="fas fa-power-off"></i>
            </div>
            <h2 class="modal-title">Confirm Exit from Exam</h2>
          </div>
          <div class="modal-body">
            <div class="modal-message">
              <p class="warning-text">Warning!</p>
              <p class="message-text">
                Are you sure you want to exit the exam?<br>
                You will be directed to home page.
              </p>
            </div>
          </div>
          <div class="modal-footer">
            <button id="cancelExitBtn" class="modal-button cancel">
              <i class="fas fa-times"></i>
              <span>Return to Exam</span>
            </button>
            <button id="confirmExitBtn" class="modal-button confirm">
              <i class="fas fa-check"></i>
              <span>End Exam</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <script src="../js/exam.js"></script>
    <script src="../js/spaceBG.js"></script>
   
    <script>
     window.onload = function() {
    const modal = document.getElementById('confirmExitModal');
    const cancelBtn = document.getElementById('cancelExitBtn');
    const confirmBtn = document.getElementById('confirmExitBtn');

    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement && state.isExamStarted) {
            modal.style.display = 'flex';
        }
    });

    cancelBtn.addEventListener('click', function() {
        modal.style.display = 'none';
        document.documentElement.requestFullscreen();
    });

    confirmBtn.addEventListener('click', function() {
        state.isExamStarted = false;
        // Use a relative path or adjust the path based on your project structure
        window.location.href = 'launch.html'; // Simplified path
    });
};
    </script>
  </body>
</html>
